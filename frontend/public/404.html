<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found | Jaideep Randhawa</title>
    <meta name="robots" content="noindex" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(/fonts/geist-variable.woff2) format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root { color-scheme: light; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: #f4f5f2;
        color: #0f1512;
        font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-optical-sizing: auto;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(16px, 4vw, 40px);
        max-width: 60rem;
      }
      h1 {
        font-size: clamp(2.25rem, 5.2vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
        margin: 0 0 24px;
      }
      p { font-size: 1.125rem; line-height: 1.6; margin: 0 0 32px; max-width: 65ch; }
      a.btn {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 28px;
        background: #0a7c4a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.125rem;
      }
      a.btn:hover { background: #0f1512; }
      footer {
        padding: 0 clamp(16px, 4vw, 40px) calc(24px + env(safe-area-inset-bottom, 0px));
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      :focus-visible { outline: 3px solid #0a7c4a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found.</h1>
      <p>The address may be out of date. Everything on the site lives on the home page.</p>
      <a class="btn" href="/">Go home</a>
    </main>
    <footer>© 2026 Jaideep Randhawa</footer>
  </body>
</html>
